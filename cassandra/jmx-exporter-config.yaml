---
# JMX Exporter Configuration for Cassandra with OTLP Export

openTelemetry:
  endpoint: "http://alloy:4318"
  protocol: "http/protobuf"
  interval: 15
  #timeoutSeconds: 30
rules:
- pattern: ".*"


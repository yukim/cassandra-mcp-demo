pyroscope.agent.enabled=true
pyroscope.format=jfr
pyroscope.labels=cluster=test_cluster,host=,cassandra.dc=dc1,cassandra.rack=rack1

# Pyroscope server
pyroscope.server.address=http://lgtm:4040
pyroscope.application.name=cassandra

# Profiler configuration
pyroscope.profiler.event=cpu,alloc
pyroscope.profiler.alloc=512k
pyroscope.profiler.lock=10ms

# Upload configuration
pyroscope.upload.interval=10s
